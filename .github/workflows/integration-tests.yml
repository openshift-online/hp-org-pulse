name: Integration Tests

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # This captures the dynamic JSON array of modules to test
      matrix: ${{ steps.filter.outputs.modified_keys }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        with:
          matrix: true
          files_yaml: |
            agentic-tools:
              - 'tests/integration/constants.js'
              - 'tests/integration/helpers.js'
              - 'modules/agentic-tools/**'
              - 'tests/integration/agentic-tools.spec.js'
            hp-automation:
              - 'tests/integration/constants.js'
              - 'tests/integration/helpers.js'
              - 'modules/hp-automation/**'
              - 'fixtures/bug-refinement/**'
              - 'fixtures/jira-solve-agent/**'
              - 'fixtures/backport-tracker/**'
              - 'fixtures/risk-assessment/**'
              - 'fixtures/cve-triage/**'
              - 'fixtures/modules-state.json'
              - 'tests/integration/hp-automation-*.spec.js'
            ai-impact:
              - 'tests/integration/constants.js'
              - 'tests/integration/helpers.js'
              - 'modules/ai-impact/**'
              - 'tests/integration/ai-impact.spec.js'
            about-tabs:
              - 'tests/integration/constants.js'
              - 'tests/integration/helpers.js'
              - 'platform/about-tabs/**'
              - 'tests/integration/about-tabs.spec.js'
            sotu-dashboard:
              - 'tests/integration/constants.js'
              - 'tests/integration/helpers.js'
              - 'modules/*/client/widgets/**'
              - 'modules/*/module.json'
              - 'tests/integration/sotu-dashboard.spec.js'

  run-tests:
    name: Test ${{ matrix.module }}
    needs: detect-changes
    # Only run if one or more modules need testing
    if: needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false  # Allows other modules to finish even if one fails
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Run Module Test
        uses: ./.github/actions/test-org-pulse-module
        with:
          module: ${{ matrix.module }}

  integration-test-status:
    name: Integration Test Status
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-changes, run-tests]
    permissions: {}
    steps:
      - name: Evaluate integration test results
        run: |
          if [ "${{ needs.run-tests.result }}" = "success" ]; then
            echo "All integration tests passed"
          elif [ "${{ needs.run-tests.result }}" = "skipped" ]; then
            echo "No module changes — integration tests skipped"
          else
            echo "Integration tests failed"
            exit 1
          fi
